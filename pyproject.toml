[project]
name = "repo-mentor-ai"
version = "0.1.0"
description = "LLM-assisted open-source issue solver for Zulip"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "httpx",
    "python-dotenv",
    "pydantic",
    "typer",
    "rich",
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]